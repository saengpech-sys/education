<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PISA Exam Generator - เครื่องมือสร้างข้อสอบ PISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
        .form-input {
            background-color: #1F2937;
            border-color: #4B5563;
            color: #F3F4F6;
        }
        .form-input:focus {
            --tw-ring-color: #4F46E5;
            border-color: #4F46E5;
        }
        .btn-primary {
            background-image: linear-gradient(to right, #6D28D9, #4F46E5);
        }
        .btn-secondary {
            background-image: linear-gradient(to right, #059669, #10B981);
        }
        .toast {
            animation: fade-in-out 3s ease-in-out forwards;
        }
        @keyframes fade-in-out {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        .prose {
            color: #D1D5DB;
            line-height: 1.6;
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
            color: #F9FAFB;
            font-weight: 600;
            margin-bottom: 0.5em;
            margin-top: 1em;
        }
        .prose p {
            margin-bottom: 1em;
        }
        .prose ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .prose ol {
            list-style-type: decimal;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .prose li {
            margin-bottom: 0.5em;
        }
        .prose strong, .prose b {
            color: #F9FAFB;
            font-weight: 600;
        }
        .prose a {
            color: #818CF8;
            text-decoration: underline;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">PISA Exam Generator</h1>
            <p class="text-gray-400 mt-2">เครื่องมือช่วยสร้างข้อสอบแนว PISA ด้วย AI</p>
        </header>

        <main>
            <!-- Form Section -->
            <div id="form-section" class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
                <form id="exam-form">
                    <div class="grid md:grid-cols-3 gap-6">
                        <div>
                            <label for="topic" class="block mb-2 text-sm font-medium text-gray-300">หัวข้อ (Topic)</label>
                            <input type="text" id="topic" class="form-input w-full p-3 rounded-lg focus:ring-2" placeholder="เช่น การเปลี่ยนแปลงสภาพภูมิอากาศ" required>
                        </div>
                        <div>
                            <label for="difficulty" class="block mb-2 text-sm font-medium text-gray-300">ระดับความยาก (Difficulty)</label>
                            <select id="difficulty" class="form-input w-full p-3 rounded-lg focus:ring-2">
                                <option>ง่าย</option>
                                <option selected>ปานกลาง</option>
                                <option>ยาก</option>
                                <option>ยากที่สุด</option>
                            </select>
                        </div>
                        <div>
                            <label for="target" class="block mb-2 text-sm font-medium text-gray-300">กลุ่มเป้าหมาย (Target)</label>
                            <select id="target" class="form-input w-full p-3 rounded-lg focus:ring-2">
                                <option>ม.1</option>
                                <option>ม.2</option>
                                <option selected>ม.3</option>
                                <option>ม.4</option>
                                <option>ม.5</option>
                                <option>ม.6</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-8 text-center">
                        <button type="submit" class="btn-primary text-white font-bold py-3 px-10 rounded-full shadow-lg hover:scale-105 transform transition-transform duration-300 ease-in-out flex items-center justify-center mx-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m15.232 5.232 3.536 3.536m-2.036-5.036a2.5 2.5 0 1 1 3.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            สร้างข้อสอบ
                        </button>
                    </div>
                </form>
            </div>

            <!-- Loading Spinner -->
            <!-- UPDATED: Replaced Lottie with a reliable, self-contained SVG spinner -->
            <div id="loader" class="hidden flex flex-col items-center justify-center py-10">
                <svg class="animate-spin h-16 w-16 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-4 text-gray-400 text-lg">AI กำลังสร้างข้อสอบ... กรุณารอสักครู่</p>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="hidden mt-8">
                <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
                    <h2 class="text-2xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500" id="result-topic"></h2>
                    <p class="text-lg text-gray-300 mb-6" id="result-competency"></p>
                    
                    <div class="bg-gray-900 p-6 rounded-xl border border-gray-700 mb-6">
                        <h3 class="text-xl font-semibold mb-3 text-indigo-400">สถานการณ์ (Stimulus)</h3>
                        <div class="prose max-w-none" id="result-stimulus"></div>
                    </div>

                    <h3 class="text-xl font-semibold mb-4 text-indigo-400">ชุดคำถาม (Question Set)</h3>
                    <div id="question-set-container" class="space-y-6"></div>
                    
                    <div class="mt-8 text-center">
                        <button id="save-button" class="btn-secondary text-white font-bold py-3 px-10 rounded-full shadow-lg hover:scale-105 transform transition-transform duration-300 ease-in-out flex items-center justify-center mx-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            บันทึกข้อมูล
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50"></div>

    <script>
        const form = document.getElementById('exam-form');
        const loader = document.getElementById('loader');
        const formSection = document.getElementById('form-section');
        const resultSection = document.getElementById('result-section');
        const saveButton = document.getElementById('save-button');

        const difyApiUrl = 'https://meekroo.org/v1/chat-messages';
        const difyApiKey = 'app-DH8ERxQovsc9Cyy3wQedcjQf';
        const webhookUrl = 'https://n8n.meekroo.org/webhook/3efb143a-d237-45f9-bba2-0091aa05f400';

        let currentExamData = null;

        function showToast(message, isError = false) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = isError ? 'bg-red-500' : 'bg-green-500';
            toast.className = `toast ${bgColor} text-white py-2 px-4 rounded-lg shadow-md`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value;
            const difficulty = document.getElementById('difficulty').value;
            const target = document.getElementById('target').value;

            formSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            loader.classList.remove('hidden');
            currentExamData = null;

            try {
                const response = await fetch(difyApiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${difyApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {
                            topic: topic,
                            difficulty: difficulty,
                            target: target
                        },
                        query: topic, 
                        user: 'pisa-generator-app-user',
                        response_mode: 'blocking'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Dify API Error Response:", errorText);
                    throw new Error(`Dify API error! Status: ${response.status}`);
                }

                const data = await response.json();
                
                let examData;
                if (typeof data.answer === 'string') {
                    const cleanedString = data.answer.replace(/```json\n|```/g, '').trim();
                    try {
                        examData = JSON.parse(cleanedString);
                    } catch (jsonError) {
                        console.error("Failed to parse JSON from Dify response:", cleanedString);
                        throw new Error("AI did not return valid JSON data.");
                    }
                } else if (typeof data.answer === 'object' && data.answer !== null) {
                    examData = data.answer;
                } else {
                    throw new Error("Received an unexpected data type from the AI.");
                }

                currentExamData = examData;
                renderExam(currentExamData);

            } catch (error) {
                console.error('Error generating exam:', error);
                showToast('เกิดข้อผิดพลาดในการสร้างข้อสอบ: ' + error.message, true);
                formSection.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        });

        function renderExam(data) {
            document.getElementById('result-topic').innerHTML = marked.parse(`หัวข้อ: ${data.topic || ''}`);
            document.getElementById('result-competency').innerHTML = marked.parse(`สมรรถนะ: ${data.competency || ''}`);
            document.getElementById('result-stimulus').innerHTML = marked.parse(data.stimulus || '');

            const container = document.getElementById('question-set-container');
            container.innerHTML = ''; 

            if (data.question_set && Array.isArray(data.question_set)) {
                data.question_set.forEach(q => {
                    const questionCard = document.createElement('div');
                    questionCard.className = 'bg-gray-900/50 p-5 rounded-lg border border-gray-700';

                    let optionsHtml = '<div class="space-y-2 mt-4">';
                    if(q.options && Array.isArray(q.options)){
                        q.options.forEach((opt, index) => {
                            optionsHtml += `<div class="flex items-start"><span class="text-indigo-400 font-semibold mr-2 pt-1">${String.fromCharCode(65 + index)}.</span><div class="prose max-w-none">${marked.parse(opt || '')}</div></div>`;
                        });
                    }
                    optionsHtml += '</div>';
                    
                    questionCard.innerHTML = `
                        <div class="flex justify-between items-start gap-4">
                            <div class="prose max-w-none text-gray-100 font-semibold text-lg">${marked.parse(`คำถามที่ ${q.question_number || ''}: ${q.question_text || ''}`)}</div>
                            <span class="flex-shrink-0 text-sm font-medium px-3 py-1 rounded-full ${
                                q.difficulty === 'ง่าย' ? 'bg-green-800 text-green-200' : 
                                q.difficulty === 'ปานกลาง' ? 'bg-yellow-800 text-yellow-200' : 
                                q.difficulty === 'ยาก' ? 'bg-red-800 text-red-200' : 
                                'bg-purple-800 text-purple-200'
                            }">${q.difficulty || ''}</span>
                        </div>
                        <div class="prose max-w-none text-sm text-gray-400 mt-1">${marked.parse(`ประเภท: ${q.question_type || ''}`)}</div>
                        ${optionsHtml}
                        <div class="mt-4 pt-4 border-t border-gray-700">
                            <div class="prose max-w-none text-green-400 font-semibold">${marked.parse(`คำตอบที่ถูกต้อง: ${q.correct_answer || ''}`)}</div>
                            <div class="prose max-w-none text-gray-400 mt-2"><span class="font-semibold text-gray-300">คำอธิบาย:</span>${marked.parse(q.rationale || '')}</div>
                        </div>
                    `;
                    container.appendChild(questionCard);
                });
            }

            resultSection.classList.remove('hidden');
        }

        saveButton.addEventListener('click', async () => {
            if (!currentExamData) {
                showToast('ไม่มีข้อมูลสำหรับบันทึก', true);
                return;
            }
            
            saveButton.disabled = true;
            saveButton.textContent = 'กำลังบันทึก...';

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(currentExamData)
                });

                if (!response.ok) {
                    throw new Error(`Webhook error! Status: ${response.status}`);
                }
                
                showToast('บันทึกข้อมูลสำเร็จ!', false);

                setTimeout(() => {
                    resultSection.classList.add('hidden');
                    formSection.classList.remove('hidden');
                    form.reset(); 
                }, 500); 

            } catch (error) {
                console.error('Error saving data:', error);
                showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', true);
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>บันทึกข้อมูล`;
            }
        });
    </script>
</body>
</html>
